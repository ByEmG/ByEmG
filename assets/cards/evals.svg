<text x="32" y="140" class="s" font-size="16" font-weight="600" fill="#ece9e2" fill-opacity=".92">Measuring how agents fail.</text>
<text x="32" y="176" class="s" font-size="14.2" fill="#8d897e">An evaluation harness for LLM agents. Every failure is classified</text><text x="32" y="198" class="s" font-size="14.2" fill="#8d897e">against a six-category taxonomy, with pass rate, cost and latency</text><text x="32" y="220" class="s" font-size="14.2" fill="#8d897e">reported per run.</text>
